<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somos Perú Trujillo</title>

<style>

body{
    margin:0;
    background:#083a9b;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    padding:20px;
    border-bottom:4px solid #e31d3b;
}

.logo img{
    max-width:220px;
    max-height:90px;
}

.titulo{
    text-align:center;
    color:#153d8f;
    font-weight:bold;
    font-size:20px;
    padding:20px;
}

.form{
    padding:20px;
}

.form label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-size:12px;
    font-weight:bold;
    color:#555;
}

.form input{
    width:100%;
    padding:14px;
    box-sizing:border-box;
    border:1px solid #d8d8d8;
    border-radius:6px;
    background:#f7f7f7;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#f01845;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.footer{
    background:#083a9b;
    color:white;
    text-align:center;
    padding:12px;
    font-size:11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <div class="titulo">
        REGISTRO DE CAMPAÑA
    </div>

    <div class="form">

        <label>NOMBRE COMPLETO</label>
        <input id="nombre" type="text">

        <label>NÚMERO DE CONTACTO</label>
        <input id="contacto" type="text">

        <label>ZONA</label>
        <input id="zona" type="text">

        <label>COMUNA</label>
        <input id="comuna" type="text">

        <button class="btn" onclick="enviar()">
            REGISTRARME
        </button>

    </div>

    <div class="footer">
        Campaña Somos Perú Trujillo
    </div>

</div>

<script>

function enviar() {

    let formData = new FormData();

    formData.append(
        "nombre",
        document.getElementById("nombre").value
    );

    formData.append(
        "contacto",
        document.getElementById("contacto").value
    );

    formData.append(
        "zona",
        document.getElementById("zona").value
    );

    formData.append(
        "comuna",
        document.getElementById("comuna").value
    );

    fetch(
        "https://script.google.com/macros/s/AKfycbw3cu2uLnYNtgOu-czi6IpW5CekoUUfLlvAhtUj_whIXF1hMRX-CXKjgoJSC1NrOHybTQ/exec",
        {
            method: "POST",
            body: formData
        }
    )
    .then(() => {

        alert("✅ Registro guardado");

        document.getElementById("nombre").value = "";
        document.getElementById("contacto").value = "";
        document.getElementById("zona").value = "";
        document.getElementById("comuna").value = "";

    })
    .catch(error => {

        console.error(error);
        alert("❌ Error al guardar");

    });

}

</script>

</body>
</html>
