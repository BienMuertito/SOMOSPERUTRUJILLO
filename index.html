<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Campaña</title>

<style>

body{
    margin:0;
    background:#062b8f;
    font-family:Arial, sans-serif;
}

.contenedor{
    max-width:380px;
    margin:20px auto;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

.logo{
    text-align:center;
    padding:20px;
    border-bottom:4px solid #e41c3d;
}

.logo img{
    max-width:220px;
}

.titulo{
    text-align:center;
    color:#133b8f;
    font-weight:bold;
    padding:20px 0;
}

.formulario{
    padding:20px;
}

label{
    font-size:12px;
    font-weight:bold;
    color:#555;
    display:block;
    margin-bottom:5px;
}

input, select{
    width:100%;
    padding:14px;
    border:1px solid #dcdcdc;
    border-radius:6px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    background:#ef2048;
    color:white;
    border:none;
    padding:16px;
    border-radius:8px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.footer{
    background:#0a348f;
    color:white;
    text-align:center;
    font-size:11px;
    padding:10px;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="logo">
    <img src="https://via.placeholder.com/220x70?text=LOGO" alt="Logo">
</div>

<div class="titulo">
    REGISTRO DE CAMPAÑA
</div>

<div class="formulario">

<label>GUÍA</label>
<input type="text" placeholder="Ej: G001">

<label>NOMBRE COMPLETO</label>
<input type="text" placeholder="Ej: Juan Pérez García">

<label>DNI</label>
<input type="text" placeholder="Ej: 12345678">

<label>CELULAR</label>
<input type="text" placeholder="Ej: 987654321">

<label>ZONA</label>
<select>
    <option>Selecciona una zona</option>
</select>

<label>COMUNA</label>
<input type="text" placeholder="Ej: Urbanización Las Flores">

<button>
REGISTRARME
</button>

</div>

<div class="footer">
Campaña Somos Perú Trujillo
</div>

</div>

</body>
</html>
</div>
