<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Campaña</title>

<style>

body{
    margin:0;
    background:#083a9b;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
    background:#ffffff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    padding:20px;
    border-bottom:4px solid #e31d3b;
}

.logo img{
    max-width:220px;
    max-height:90px;
}

.titulo{
    text-align:center;
    color:#153d8f;
    font-weight:bold;
    font-size:18px;
    padding:20px;
    letter-spacing:1px;
}

.form{
    padding:20px;
}

.form label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#555;
    margin-bottom:5px;
    margin-top:12px;
}

.form input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #d8d8d8;
    border-radius:6px;
    background:#f7f7f7;
    font-size:14px;
}

.form input:focus{
    outline:none;
    border-color:#083a9b;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#f01845;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.btn:hover{
    background:#d9143d;
}

.footer{
    background:#083a9b;
    color:white;
    text-align:center;
    font-size:11px;
    padding:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <div class="titulo">
        REGISTRO DE CAMPAÑA
    </div>

    <div class="form">

        <label>NOMBRE COMPLETO</label>
        <input id="nombre" type="text" placeholder="Ej: Juan Pérez García">

        <label>NÚMERO DE CONTACTO</label>
        <input id="contacto" type="text" placeholder="Ej: 987654321">

        <label>ZONA</label>
        <input id="zona" type="text" placeholder="Escriba la zona">

        <label>COMUNA</label>
        <input id="comuna" type="text" placeholder="Ej: Urbanización Las Flores">

        <button class="btn" onclick="enviar()">
            REGISTRARME
        </button>

    </div>

    <div class="footer">
        Campaña Somos Perú Trujillo
    </div>

</div>

<script>

async function enviar() {

    const datos = {
        nombre: document.getElementById("nombre").value,
        contacto: document.getElementById("contacto").value,
        zona: document.getElementById("zona").value,
        comuna: document.getElementById("comuna").value
    };

    if(
        !datos.nombre ||
        !datos.contacto ||
        !datos.zona ||
        !datos.comuna
    ){
        alert("Complete todos los campos");
        return;
    }

    try {

        const respuesta = await fetch(
            "https://script.google.com/macros/s/AKfycbw3cu2uLnYNtgOu-czi6IpW5CekoUUfLlvAhtUj_whIXF1hMRX-CXKjgoJSC1NrOHybTQ/exec",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            }
        );

        if(respuesta.ok){

            alert("✅ Registro guardado correctamente");

            document.getElementById("nombre").value = "";
            document.getElementById("contacto").value = "";
            document.getElementById("zona").value = "";
            document.getElementById("comuna").value = "";

        } else {

            alert("❌ Error al registrar");

        }

    } catch(error) {

        console.error(error);
        alert("❌ Error de conexión");

    }

}

</script>

</body>
</html>
