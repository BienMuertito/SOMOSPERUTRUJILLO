<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somos Perú Trujillo</title>

<style>
body{
    background:#002b8f;
    margin:0;
    font-family:Arial,sans-serif;
}

.container{
    max-width:400px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
}

h2{
    color:#002b8f;
    text-align:center;
}

input, select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#e91e63;
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>REGISTRO DE CAMPAÑA</h2>

<form>

<input type="text" placeholder="Nombre completo" required>

<input type="tel" placeholder="Número de contacto" required>

<select required>
<option value="">Selecciona una zona</option>
<option>Centro</option>
<option>Norte</option>
<option>Sur</option>
<option>Trujillo</option>
</select>

<input type="text" placeholder="Comuna o Sector">

<button type="submit">
REGISTRARME
</button>

</form>

</div>

</body>
</html>
